# Dependabot：自动检测依赖更新并开 PR，替代手工 npm outdated / audit fix
# 参考：https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # 前端依赖（根 package.json）
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    # 仅自动合并补丁/小版本安全更新时可在此扩展；默认人工评审后合并

  # 服务端依赖（server/package.json）
  - package-ecosystem: npm
    directory: "/server"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # GitHub Actions 版本
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
