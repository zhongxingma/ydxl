name: Security

# 安全扫描流水线（与 CI 分离，避免拖慢主构建）
# - dependency-review：PR 引入/升级依赖时审查已知漏洞（公共仓库免费；私有仓库需 GitHub Advanced Security）
# - codeql：静态代码扫描（JS/TS），捕获注入、XSS、不安全反序列化等安全类缺陷
# 参考：https://docs.github.com/zh/code-security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 03:00 UTC 全量扫描，捕获新披露的漏洞（即使无代码变更）
    - cron: '0 3 * * 1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 依赖漏洞审查：仅 PR 触发，比较 base..head 的依赖变更
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # 引入 high / critical 级依赖漏洞直接失败，阻断合入
          fail-on-severity: high

  # CodeQL 静态代码扫描（JavaScript / TypeScript）
  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-extended 覆盖更多查询规则（含部分高危但非默认的检查）
          queries: security-extended
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
