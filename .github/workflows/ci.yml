name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node 20：代码依赖全局 WebCrypto（crypto.subtle，Node 19+ 默认可用），
  # Node 18 会导致 vite build 报 "crypto is not defined" 且 contentHash 回退
  # 到短哈希使前端去重测试失败；且 Node 18 已于 2025-04 EOL
  NODE_VERSION: '20'

jobs:
  # 前端 Lint
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  # 前端测试（109 文件 / 839 用例，含覆盖率防回退阈值校验）
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      # 无论测试/阈值是否通过都上传覆盖率报告，便于定位回退位置
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # 服务端类型检查（tsc build）+ 测试（22 文件 / 216 用例）
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm --prefix server ci
      - run: npm --prefix server run build
      - run: npm --prefix server test

  # 生产构建（`tsc -b` 同时承担前端类型检查）
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

  # 浏览器级 E2E（Playwright：真实浏览器访问 vite dev，/api 由 page.route 拦截返回
  # 预置 fixture，不启动真实后端）。@playwright/test 1.x 要求 Node >= 20，
  # 上面全局 NODE_VERSION 已统一为 20。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # 第一轮：vite dev + page.route 拦截（阅读 / 复习 / 离线回退 / 生词本 / 打印）
      - run: npx playwright test
      # 第二轮：vite build + vite preview，验证生产构建 SW 预缓存离线整页重载
      - run: npm run test:e2e:sw
