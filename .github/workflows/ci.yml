name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node 20：代码依赖全局 WebCrypto（crypto.subtle，Node 19+ 默认可用），
  # Node 18 会导致 vite build 报 "crypto is not defined" 且 contentHash 回退
  # 到短哈希使前端去重测试失败；且 Node 18 已于 2025-04 EOL
  NODE_VERSION: '20'

jobs:
  # 质量门禁：生产依赖漏洞审计 + 文档数值一致性校验 + 中文硬编码护栏
  # 均只读 lockfile / 源码，无需安装 node_modules，因此单独成 job 且执行极快
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # 生产依赖（--omit=dev）不允许 high / critical 漏洞；
      # dev 依赖漏洞为上游传递链（minimatch / glob / ejs / deepmerge，无非破坏性修复），不阻断构建
      - name: Audit production dependencies (frontend)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit production dependencies (server)
        run: npm --prefix server audit --omit=dev --audit-level=high
      # 文档声明的测试文件数 / SQLite 与 Dexie 表数必须与代码实际值一致
      - name: Verify doc metrics
        run: npm run docs:verify
      # 中文字面量护栏：与 scripts/i18n-baseline.json 基线比较，新增硬编码文案直接阻断
      - name: Check hardcoded Chinese literals
        run: npm run i18n:check

  # 前端 Lint
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  # 前端测试（203 文件 / 1764 用例，含覆盖率防回退阈值校验）
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      # 无论测试/阈值是否通过都上传覆盖率报告，便于定位回退位置
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # 服务端类型检查（tsc build）+ 测试（24 文件 / 247 用例）
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm --prefix server ci
      - run: npm --prefix server run build
      - run: npm --prefix server test

  # 生产构建（`tsc -b` 同时承担前端类型检查）
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

  # 浏览器级 E2E（Playwright：真实浏览器访问 vite dev，/api 由 page.route 拦截返回
  # 预置 fixture，不启动真实后端）。@playwright/test 1.x 要求 Node >= 20，
  # 上面全局 NODE_VERSION 已统一为 20。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      # 真实后端 E2E（test:e2e:real）会启动 Express 服务，需安装后端依赖
      - run: npm --prefix server ci
      - run: npx playwright install --with-deps chromium
      # 第一轮：vite dev + page.route 拦截（阅读 / 复习 / 离线回退 / 生词本 / 打印）
      - run: npx playwright test
      # 第二轮：真实 Express + 临时 SQLite + vite dev（真实后端主链路，不拦截 /api）
      - run: npm run test:e2e:real
      # 第三轮：vite build + vite preview，验证生产构建 SW 预缓存离线整页重载
      - run: npm run test:e2e:sw

  # ---------- CI 自动部署（骨架：Secret 门控，默认跳过） ----------
  # 这是「骨架」阶段：以 GitHub Secrets 门控，未配置部署凭据时 deploy-gate 输出
  # ready=false，deploy job 整段显示 skipped，CI 仍保持绿色（未配凭据的仓库 / fork
  # 不会因此失败）；在 repo Settings → Secrets and variables → Actions 配好凭据后
  # 即自动启用，无需改代码。
  #
  # 需要配置的 Secrets（名称固定，代码中不写任何真实凭据）：
  #   DEPLOY_SSH_KEY  部署主机 SSH 私钥（必填；免密登录用，建议单独生成部署专用密钥）
  #   DEPLOY_HOST     部署主机地址（必填）
  #   DEPLOY_USER     SSH 登录用户（必填）
  #   DEPLOY_PORT     SSH 端口（可选，默认 22）
  #   DEPLOY_DIR      主机上的项目目录（可选，默认 /opt/ydxl）
  #
  # 触发条件：push 到 main 且 build / e2e 全部通过（needs 隐含）；PR / fork 不触发。
  # 部署方式：SSH 到部署主机 → 在 DEPLOY_DIR 拉取本次 commit → 本地 docker build
  #          双 target 镜像（app / web）→ 运行 scripts/blue-green-deploy.mjs
  #          --image ydxl-app:<sha> 完成蓝绿切流 → 切流后健康校验（经 web 入口请求
  #          /api/health/ready，非 200 即部署失败并提示回滚，让部署成功有客观判据）。
  #          镜像在部署主机本地构建、不经过镜像仓库（compose 即用本地 tag）；
  #          如需 registry 分发，可改为 CI build+push、主机 docker pull 后再切流
  #          （脚本的 --image 接受任意本地 tag）。
  # 回滚：蓝绿脚本自带失败回退（新槽位未就绪 / 切流失败时保持旧槽位服务，无流量中断）；
  #       切流后健康校验失败说明新槽位服务异常，该次部署判为失败，需人工回滚：
  #       在主机上用旧镜像标签重跑
  #       node scripts/blue-green-deploy.mjs --image ydxl-app:<旧标签> 即可切回
  #       （见 docs/DEPLOYMENT.md 10.4 / 10.6）。
  #
  # 门控实现说明：GitHub Actions 的 job 级 if 不支持 secrets 上下文（直接写
  # `if: secrets.X != ''` 会在解析阶段报 "Unrecognized named-value: 'secrets'"），
  # 因此先由 deploy-gate job 探测凭据是否配置，再用 needs 输出门控 deploy job。
  deploy-gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      # 仅探测 Secrets 是否已配置（经 env 注入做空值判断，避免把值展开到脚本/日志）；
      # 只探测必填三项（DEPLOY_SSH_KEY / DEPLOY_HOST / DEPLOY_USER），
      # DEPLOY_PORT / DEPLOY_DIR 有默认值，不参与门控
      - name: Check deploy secrets
        id: check
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets not configured — deploy stage skipped (skeleton mode)."
          fi

  deploy:
    needs: [build, e2e, deploy-gate]
    # 三重门控：push→main 事件 + build/e2e 成功（needs 隐含）+ 凭据就绪；
    # 任一不满足时本 job 显示 skipped，不阻断 CI
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy-gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy via SSH (blue-green + post-switch health check)
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_SHA: ${{ github.sha }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GITHUB_SHA,DEPLOY_DIR
          script: |
            # 任一命令失败立即退出（git / build / 切流 / 健康校验均不带过）
            set -eu
            cd "${DEPLOY_DIR:-/opt/ydxl}"

            # 1. 拉取本次构建对应的代码（前提：主机已有仓库完整克隆且有 fetch 权限）
            git fetch origin
            git checkout --force "$GITHUB_SHA"

            # 2. 构建双 target 镜像（两 target 共享前置 build 阶段层，第二次 build
            #    直接命中主机 docker 层缓存；APP_VERSION 注入 commit，与镜像标签
            #    ydxl-app:<sha> 同源，切流后可用 /api/health 的 version 字段核对线上
            #    版本；web 内含前端产物）
            docker build --target app --build-arg APP_VERSION="$GITHUB_SHA" -t "ydxl-app:$GITHUB_SHA" .
            docker build --target web -t "ydxl-web:$GITHUB_SHA" .
            # compose 默认解析 YDXL_WEB_IMAGE:-ydxl-web:latest，同步打 latest 标签，
            # 避免 blue-green 脚本内部 up -d web 时把 web 回退到旧镜像
            docker tag "ydxl-web:$GITHUB_SHA" ydxl-web:latest
            # 刷新前端产物（upstream 仍指向当前激活槽位，API 不中断）
            docker compose up -d --no-deps web

            # 3. 蓝绿切流：起新槽位 → /api/health/ready 就绪门禁 → 切流 → 停旧槽位
            #    可选安全开关：首次启用建议先演练（只打印计划动作、不改动容器），
            #    把下行替换为：
            #      node scripts/blue-green-deploy.mjs --image "ydxl-app:$GITHUB_SHA" --dry-run
            node scripts/blue-green-deploy.mjs --image "ydxl-app:$GITHUB_SHA" --timeout 180

            # 4. 切流后健康校验：经 web 入口请求就绪探针，覆盖「nginx → 当前激活
            #    槽位 → app」线上真实流量路径，让「部署成功」有客观判据；
            #    端口解析与 docker-compose.yml 的 ${WEB_PORT:-8080} 一致
            #    （环境变量优先，其次 .env，均取不到时用 8080）
            web_port="${WEB_PORT:-}"
            if [ -z "$web_port" ] && [ -f .env ]; then
              web_port="$(sed -n 's/^WEB_PORT=//p' .env | tail -n 1)"
            fi
            web_port="${web_port:-8080}"
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${web_port}/api/health/ready" || true)"
            if [ "$code" != "200" ]; then
              echo "::error::切流后健康校验失败：http://127.0.0.1:${web_port}/api/health/ready 返回 ${code:-无响应}，本次部署视为失败；请在主机上用旧镜像标签重跑 node scripts/blue-green-deploy.mjs --image ydxl-app:<旧标签> 回滚"
              exit 1
            fi
            echo "切流后健康校验通过：http://127.0.0.1:${web_port}/api/health/ready 返回 200"
