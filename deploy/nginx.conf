# ydxl 容器化反向代理（Nginx）
#
# 职责：静态前端（/usr/share/nginx/html）+ /api 反代到当前激活的蓝绿槽位。
# upstream `ydxl_app` 由 deploy/active-upstream.conf 定义（挂载为 conf.d/00-upstream.conf），
# 蓝绿发布脚本改写该文件后执行 `nginx -s reload` 完成切流，Nginx 本身无需重启。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端构建产物带内容哈希，可长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # PWA Service Worker 与清单不缓存，确保版本更新及时生效
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # API 反代到当前槽位（upstream 见 00-upstream.conf）
    location /api/ {
        proxy_pass http://ydxl_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 上游单次最长 150s（见 server/src/ai-proxy.ts），留出余量
        proxy_read_timeout 300s;
        # SSE 流式代理需关闭缓冲，避免事件被攒批
        proxy_buffering off;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
